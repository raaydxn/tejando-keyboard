name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Localizar projeto
        run: |
          if [ -f TejandoKeyboard.zip ]; then
            unzip -q -o TejandoKeyboard.zip -d _src
            echo "PROJECT_DIR=_src/TejandoKeyboard" >> "$GITHUB_ENV"
          elif [ -f settings.gradle.kts ]; then
            echo "PROJECT_DIR=." >> "$GITHUB_ENV"
          else
            echo "Projeto nao encontrado"
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Compilar
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle assembleDebug --stacktrace

      - name: Preparar APK
        run: |
          mkdir -p out
          cp "$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk" out/TejandoKeyboard.apk

      - uses: actions/upload-artifact@v4
        with:
          name: TejandoKeyboard-apk
          path: out/TejandoKeyboard.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Tejando Keyboard build ${{ github.run_number }}
          files: out/TejandoKeyboard.apk
